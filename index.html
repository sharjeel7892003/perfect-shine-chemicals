<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="description" content="Perfect Shine Chemicals — Factory Management System & POS for Lahore manufacturing facility." />
    <title>Perfect Shine Chemicals — Factory ERP & POS</title>
    <!-- Modern Inter typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <!-- Emergency Startup Diagnostics Overlay -->
    <div id="global-error-overlay" style="display:none; position:fixed; z-index:999999; top:0; left:0; right:0; background:#7f1d1d; color:#fee2e2; padding:16px 20px; font-family:system-ui, -apple-system, sans-serif; font-size:13px; line-height:1.5; border-bottom:2px solid #ef4444; box-shadow:0 8px 30px rgba(0,0,0,0.5);">
      <div style="max-width:1100px; margin:0 auto;">
        <strong style="font-size:15px; display:block; margin-bottom:4px; color:#fff;">⚠️ Application Startup Error Encountered</strong>
        <div id="global-error-msg" style="font-family:monospace; background:#450a0a; padding:10px 14px; border-radius:8px; margin:8px 0; border:1px solid #991b1b; white-space:pre-wrap; word-break:break-word;"></div>
        <div style="margin-top:10px; display:flex; gap:10px;">
          <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="cursor:pointer; background:#dc2626; color:white; border:none; padding:6px 14px; border-radius:6px; font-weight:bold; font-size:12px;">Reset Storage & Reload</button>
          <button onclick="window.location.reload();" style="cursor:pointer; background:#374151; color:white; border:none; padding:6px 14px; border-radius:6px; font-weight:bold; font-size:12px;">Reload Page</button>
        </div>
      </div>
    </div>
    <script>
      (function() {
        function showError(msg, details) {
          var el = document.getElementById('global-error-overlay');
          var textEl = document.getElementById('global-error-msg');
          if (el && textEl) {
            el.style.display = 'block';
            textEl.textContent = (msg || 'Unknown error') + (details ? '\n' + details : '');
          }
        }
        window.addEventListener('error', function(e) {
          showError(e.message || 'Script execution error', (e.filename ? e.filename + ':' + e.lineno : '') + (e.error && e.error.stack ? '\n' + e.error.stack : ''));
        });
        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason;
          showError(r && (r.message || r.toString()) || 'Unhandled Promise Rejection', r && r.stack ? r.stack : '');
        });
      })();
    </script>

    <div id="root">
      <!-- Fallback shown while React initializes -->
      <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#020617; color:#f8fafc; font-family:system-ui, -apple-system, sans-serif; text-align:center; padding:24px;">
        <div style="width:44px; height:44px; border:3px solid rgba(16,185,129,0.2); border-top-color:#10b981; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:16px;"></div>
        <h2 style="margin:0 0 6px 0; font-size:18px; font-weight:800; letter-spacing:-0.025em; color:#fff;">Perfect Shine Chemicals</h2>
        <p style="margin:0; font-size:13px; color:#94a3b8;">Initializing factory management system...</p>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
